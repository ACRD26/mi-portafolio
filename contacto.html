
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Aura Rodríguez</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Menú de navegación -->
    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">
                <span class="logo-iniciales">AR</span>
                <span class="logo-nombre">Aura Rodríguez</span>
            </a>

            <ul class="menu">
                <li><a href="index.html#inicio">Inicio</a></li>
                <li><a href="index.html#sobre-mi">Sobre mí</a></li>
                <li><a href="index.html#habilidades">Habilidades</a></li>
                <li><a href="proyectos.html">Proyectos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>

            <button id="tema-btn">🌙 Modo oscuro</button>

        </nav>
    </header>

    <!-- Formulario de contacto -->
    <section class="seccion contacto">

        <h2>¡Contactame!</h2>

        <p class="contacto-descripcion">
            ¿Tienes alguna propuesta, pregunta o te gustaría
            trabajar conmigo? Déjame un mensaje.
        </p>

        <form action="https://formsubmit.co/aurarodriguezd26@gmail.com"
              method="POST" class="formulario">

            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Escribe tu nombre" required>
            </div>

            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo"
                       placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo">
                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" name="asunto"
                       placeholder="Motivo del mensaje" required>
            </div>

            <div class="campo">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje"
                          rows="5"
                          placeholder="Escribe tu mensaje aquí..."
                          required></textarea>
            </div>

            <button type="submit" class="boton">
                Enviar mensaje ✉
            </button>

        </form>

    </section>

    <footer>
        <p>© 2026 Aura Rodríguez | Mi portafolio personal</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
